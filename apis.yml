name: Vectoree

image: https://vectoree.ai/og-home.png

description: Vectoree is a backend-as-a-service platform designed for AI coding agents. It offers OpenAI‑compatible model access, authentication,
  managed Postgres databases, object storage, and a curated tool hub. Developers install a single CLI, obtain a project key, and interact via
  standard OpenAI SDKs, enabling rapid development, deployment, and scaling of agents with a simple pay‑as‑you‑go model.

